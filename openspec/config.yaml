schema: spec-driven

context: |
  Language: Russian
  All artifacts must be written in Russian.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.
  Code, file paths, config keys and UI strings stay as in the code.

  Project: own product grown from a fork of wladich/nakarte (Leaflet map app, webpack,
  ES modules, knockout) with routing via BRouter, either a local server or BRouter running
  in the browser (CheerpJ). A new client (React, Vite, TypeScript, MapLibre, shadcn/ui)
  grows in web/ and is served at /next/ until it replaces the old one. Public clone on Cloudflare: Pages + Pages Functions, R2,
  own Workers in workers/ instead of the author's *.nakarte.me services.
  Upstream is a reference only: no merges or PRs to it, upstream files may be edited or
  deleted, unused code is deleted rather than hidden.
  Where facts live (one place each) and run, environment, pitfalls: AGENTS.md.

rules:
  tasks:
    - 'В change с кодом есть задачи на тесты и на подключение их к CI по правилам `AGENTS.md`, раздел «Свои бэкенды» (свой workflow сервиса, karma для старого клиента в `src/`, Vitest и Playwright в `web/` с `check-web.yml`, без сети); у каждой задачи с кодом проверка — зелёный тест.'

operations:
  apply:
    guidance:
      - 'Задача с кодом закрывается только с зелёным тестом, подключённым к CI.'

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
