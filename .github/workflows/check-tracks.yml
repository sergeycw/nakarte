name: check tracks

on:
  push:
    branches: [master]
    paths:
      - 'workers/tracks/**'
      - '.github/workflows/check-tracks.yml'
  pull_request:
    paths:
      - 'workers/tracks/**'
      - '.github/workflows/check-tracks.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/tracks
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: workers/tracks/package-lock.json
      - run: npm ci
      - run: npm test
