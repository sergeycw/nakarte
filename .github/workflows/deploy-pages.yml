name: deploy pages

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-pages
  cancel-in-progress: true

# Секреты Cloudflare — только в env шагов с wrangler: установка зависимостей, тесты и сборка идут без них
# (requirement «Секреты только у шагов публикации», clone-deploy). Версия wrangler точная: npx не тянет
# новую 4.x на каждом деплое; обновлять здесь.
env:
  WRANGLER: wrangler@4.148.0

permissions:
  contents: read
  # gh run list в job changes: ищет последний успешный деплой
  actions: read

jobs:
  # Что выкатывать: сервисы, чьи файлы менялись с последнего успешного прогона этого workflow.
  # База — успешный прогон, а не github.event.before: прогон, отменённый новым push
  # (cancel-in-progress), или упавший не выкатил свои изменения, и следующий подхватит их.
  # Ручной запуск, правка этого файла или неизвестная база — выкатывается всё.
  changes:
    if: github.repository == 'sergeycw/nakarte'
    runs-on: ubuntu-latest
    outputs:
      pages: ${{ steps.diff.outputs.pages }}
      cors_proxy: ${{ steps.diff.outputs.cors_proxy }}
      tracks: ${{ steps.diff.outputs.tracks }}
      elevation: ${{ steps.diff.outputs.elevation }}
      guard: ${{ steps.diff.outputs.guard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          all() {
            echo "deploy everything: $1"
            printf 'pages=true\ncors_proxy=true\ntracks=true\nelevation=true\nguard=true\n' >> "$GITHUB_OUTPUT"
          }
          if [ "$EVENT" = workflow_dispatch ]; then all 'manual run'; exit 0; fi
          base=$(gh run list --workflow deploy-pages.yml --branch master --status success --limit 1 \
            --json headSha --jq '.[0].headSha // ""')
          if [ -z "$base" ] || ! git merge-base --is-ancestor "$base" HEAD; then all "no base ($base)"; exit 0; fi
          changed=$(git diff --name-only "$base" HEAD)
          echo "changed since $base:"; echo "$changed"
          if echo "$changed" | grep -qx '.github/workflows/deploy-pages.yml'; then all 'workflow changed'; exit 0; fi
          has() { echo "$changed" | grep -qE "$1" && echo true || echo false; }
          {
            echo "cors_proxy=$(has '^workers/cors-proxy/')"
            echo "tracks=$(has '^workers/tracks/')"
            echo "elevation=$(has '^workers/elevation/')"
            echo "guard=$(has '^workers/guard/')"
            # сайт: всё, кроме Worker'ов, документов и других workflow — приложение web/, functions/, файлы движка
            echo "pages=$(echo "$changed" | grep -vE '^(workers/(cors-proxy|tracks|elevation|guard)/|docs/|openspec/|\.github/)|\.md$' | grep -q . && echo true || echo false)"
          } | tee -a "$GITHUB_OUTPUT"

  cors-proxy:
    needs: changes
    if: needs.changes.outputs.cors_proxy == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/cors-proxy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: workers/cors-proxy/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx --yes $WRANGLER deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  tracks:
    needs: changes
    if: needs.changes.outputs.tracks == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/tracks
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: workers/tracks/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx --yes $WRANGLER deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  elevation:
    needs: changes
    if: needs.changes.outputs.elevation == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/elevation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: workers/elevation
      - run: cargo test --workspace
      - run: cargo install worker-build --version 0.8.7 --locked
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: workers/elevation/package-lock.json
      - run: npm ci
      # npm test собирает wasm и гоняет его в workerd; wrangler deploy собирает его заново
      # командой [build] из wrangler.toml
      - run: npm test
      - run: npx --yes $WRANGLER deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # Счётчик частоты Pages Functions (service binding GUARD); снаружи закрыт, деплоится до Pages.
  guard:
    needs: changes
    if: needs.changes.outputs.guard == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/guard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: workers/guard/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx --yes $WRANGLER deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # Pages после Worker'ов: при смене контракта новый клиент не должен ходить в старый сервис,
  # а привязка GUARD — указывать на несуществующий Worker.
  # Упал деплой Worker'а — Pages не выкатываются; пропущенные Worker'ы не мешают.
  pages:
    needs: [changes, cors-proxy, tracks, elevation, guard]
    if: ${{ !cancelled() && !failure() && needs.changes.outputs.pages == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      # тесты Pages Functions (functions/tiles, functions/brouter-wasm) лежат в workers/tiles
      - name: test pages functions
        working-directory: workers/tiles
        run: |
          npm ci
          npm test
      - name: build brouter engine files
        run: |
          docker create --name brouter ghcr.io/abrensch/brouter:nightly
          BROUTER_CONTAINER=brouter sh experiments/wasm/cheerpj/build.sh
      # Приложение web/ — в корень build/ (openspec/specs/web-client, design switch-to-web-app); файлы движка из
      # experiments/wasm/cheerpj/ туда же кладёт его сборка (плагин engineFiles). Vitest и e2e — как в check-web.yml (линт
      # и типы там же, на PR), e2e — по той сборке, что публикуется; упали — Pages не публикуются.
      - name: web install
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: web test
        working-directory: web
        run: npm test
      # Ключ Maps JavaScript API для окна Street View — только этому шагу (установка зависимостей и тесты идут без него;
      # спека clone-deploy, «Ключ Google только шагу сборки»). Без секрета — пустой ключ, режим без ключа; с секретом ключ
      # окажется в бандле, защищают его ограничения по referrer и API в Google Cloud.
      - name: web build
        working-directory: web
        run: npm run build
        env:
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
      - name: check engine files are in the build
        run: test -f build/brouter-wasm/lib/brouter.jar && test -f build/brouter-wasm/profiles/lookups.dat
      - name: web e2e
        working-directory: web
        run: npm run e2e
      # Адрес *.nakarte.me в бандле — обращение к инфраструктуре автора: деплой стоп
      # (требование «Бандл без адресов автора» в openspec/specs/clone-deploy). В PR то же проверяет check-web.yml.
      - name: check no author hosts in the build
        run: node scripts/check-no-author-hosts.mjs build
      - run: npx --yes $WRANGLER pages deploy build --project-name nakarte-routing --branch master
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # Каждый старый деплой отвечает по https://<хеш>.nakarte-routing.pages.dev со своими функциями,
  # то есть без новых лимитов: оставляем только текущий (requirement «Только текущий деплой Pages»,
  # clone-deploy). Отдельный job: сбой чистки не помечает деплой упавшим. Текущий — canonical_deployment
  # проекта с коммитом этого прогона; не совпал — ничего не удаляем. curl, а не wrangler pages deployment delete: тот может
  # спросить подтверждение.
  # !cancelled() обязателен: без функции статуса GitHub неявно добавляет success(), а пропуск Worker'а
  # тянется по цепочке через pages, и prune пропускался в каждом прогоне без Worker'ов
  # (архив fix-prune-after-skipped-workers).
  prune:
    needs: pages
    if: ${{ !cancelled() && needs.pages.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: delete old pages deployments
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/nakarte-routing"
          call() { curl -sS --fail-with-body -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$@"; }
          project=$(call "$api")
          current=$(echo "$project" | jq -r '.result.canonical_deployment.id // empty')
          commit=$(echo "$project" | jq -r '.result.canonical_deployment.deployment_trigger.metadata.commit_hash // empty')
          # текущий деплой обязан быть только что опубликованным, иначе удалили бы новый вместо старых
          if [ -z "$current" ] || [ "$commit" != "$GITHUB_SHA" ]; then
            echo "current deployment ${current:-unknown} is from ${commit:-unknown}, not $GITHUB_SHA: nothing deleted"
            exit 1
          fi
          echo "current deployment: $current"
          # сначала весь список, потом удаление: удаление по ходу сдвигало бы страницы
          pages=$(call "$api/deployments?per_page=25" | jq -r '.result_info.total_pages')
          ids=""
          for page in $(seq 1 "$pages"); do
            ids="$ids $(call "$api/deployments?per_page=25&page=$page" | jq -r '.result[].id')"
          done
          deleted=0
          for id in $ids; do
            [ "$id" = "$current" ] && continue
            call -X DELETE "$api/deployments/$id?force=true" > /dev/null
            deleted=$((deleted + 1))
          done
          echo "deleted $deleted old deployments"

  # Проверка прода после деплоя хотя бы одного сервиса; тот же workflow идёт раз в день сам.
  smoke:
    needs: [changes, cors-proxy, tracks, elevation, guard, pages]
    if: >-
      ${{ !cancelled() && !failure() && (needs.changes.outputs.pages == 'true'
      || needs.changes.outputs.cors_proxy == 'true' || needs.changes.outputs.tracks == 'true'
      || needs.changes.outputs.elevation == 'true' || needs.changes.outputs.guard == 'true') }}
    uses: ./.github/workflows/prod-check.yml
