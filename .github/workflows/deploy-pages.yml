name: deploy pages

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.repository == 'sergeycw/nakarte'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - run: cp src/secrets.js.template src/secrets.js
      # Ключ Maps JavaScript API для окна Street View. Без секрета ключ пустой: API работает в режиме
      # без ключа, как на nakarte.me (панорама открывается с водяным знаком «For development purposes
      # only» и окном «This page can't load Google Maps correctly»), а заглушка шаблона ломает окно
      # совсем. С секретом GOOGLE_MAPS_API_KEY (заводит владелец) — чистая панорама; ключ всё равно
      # окажется в бандле, защищают его ограничения по referrer и API в Google Cloud.
      - name: google maps key
        run: |
          sed -i "s/^    google: '[^']*',$/    google: '$GOOGLE_MAPS_API_KEY',/" src/secrets.js
          grep -qF "google: '$GOOGLE_MAPS_API_KEY'," src/secrets.js
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
      - run: yarnpkg
      - name: build brouter engine files
        run: |
          docker create --name brouter ghcr.io/abrensch/brouter:nightly
          BROUTER_CONTAINER=brouter sh experiments/wasm/cheerpj/build.sh
      - run: npm run build
        env:
          NAKARTE_TARGET: clone
      - name: check engine files are in the build
        run: test -f build/brouter-wasm/lib/brouter.jar && test -f build/brouter-wasm/profiles/lookups.dat
      - run: npx --yes wrangler@4 pages deploy build --project-name nakarte-routing --branch master
      - run: npx --yes wrangler@4 deploy
        working-directory: workers/cors-proxy
      - run: |
          npm ci --omit=dev
          npx --yes wrangler@4 deploy
        working-directory: workers/tracks
      - run: rustup toolchain install
        working-directory: workers/elevation
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: workers/elevation
      # wrangler deploy сам собирает wasm командой [build] из workers/elevation/wrangler.toml
      - run: |
          cargo install worker-build --version 0.8.7 --locked
          npx --yes wrangler@4 deploy
        working-directory: workers/elevation
