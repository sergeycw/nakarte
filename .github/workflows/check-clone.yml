name: check clone

# Сборка клона и проверка бандла на адреса автора до merge: деплой проверяет то же самое,
# но уже после него (openspec/specs/clone-deploy, «Бандл без адресов автора»). Файлы движка
# здесь не собираются: проверке бандла они не нужны.

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'openspec/**'
      - '**.md'

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: cp src/secrets.js.template src/secrets.js
      - run: yarnpkg
      - run: npm run build
        env:
          NAKARTE_TARGET: clone
      - run: node scripts/check-no-author-hosts.mjs build
