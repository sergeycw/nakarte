name: check elevation

on:
  push:
    branches: [master]
    paths:
      - 'workers/elevation/**'
      - '.github/workflows/check-elevation.yml'
  pull_request:
    paths:
      - 'workers/elevation/**'
      - '.github/workflows/check-elevation.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/elevation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # rustup на раннере сам ставит версию, таргет wasm32 и компоненты из rust-toolchain.toml
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: workers/elevation
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy -p elevation-worker --target wasm32-unknown-unknown -- -D warnings
      - run: cargo test --workspace
      - run: cargo install worker-build --version 0.8.7 --locked
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: workers/elevation/package-lock.json
      - run: npm ci
      # собирает wasm под wasm32 и гоняет его в workerd с локальным R2
      - run: npm test
