name: check lint

# Линт JS Worker'ов, Pages Functions и скриптов: Biome по корневому biome.json (только линтер, design
# switch-to-web-app). У web/ свой biome.json, его гоняет check-web.yml.

on:
  push:
    branches: [master]
    paths:
      - 'workers/**/*.js'
      - 'functions/**'
      - 'scripts/**'
      - 'biome.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/check-lint.yml'
  pull_request:
    paths:
      - 'workers/**/*.js'
      - 'functions/**'
      - 'scripts/**'
      - 'biome.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/check-lint.yml'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint
