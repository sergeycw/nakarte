name: prod check

# Синтетическая проверка своих сервисов клона на проде (scripts/prod-check.sh): раз в день и после
# каждого деплоя (job smoke в deploy-pages.yml). Падение = GitHub шлёт письмо; что сломалось —
# в логе шага, строки FAIL. После 60 дней без коммитов GitHub отключает расписание.

on:
  schedule:
    - cron: '40 5 * * *'
  workflow_dispatch:
  workflow_call:
    inputs:
      # пауза перед проверкой, с: первые десятки секунд после публикации Pages отвечает 500 и на статике,
      # и в функциях (деплои 2026-10-29 и 2026-10-30, AGENTS.md, «Подвохи клона»)
      settle_seconds:
        type: number
        default: 0

jobs:
  check:
    if: github.repository == 'sergeycw/nakarte'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: inputs.settle_seconds > 0
        run: sleep ${{ inputs.settle_seconds }}
      - run: sh scripts/prod-check.sh
