name: elevation data

# Ручная перепаковка HGT 3″ viewfinderpanoramas в бакет R2 `nakarte-elevation`
# (workers/elevation/scripts/elevation-data.sh). Загрузка упирается в лимит API Cloudflare
# (~1200 запросов за 5 минут), весь мир — несколько часов.

on:
  workflow_dispatch:
    inputs:
      zips:
        description: 'zip на viewfinderpanoramas.org без .zip через пробел (dem3/K38 dem3/L32) или all'
        required: true
        default: 'dem3/K38 dem3/K37 dem3/L32 dem3/G45'

concurrency:
  group: elevation-data
  cancel-in-progress: false

jobs:
  repack:
    if: github.repository == 'sergeycw/nakarte'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    defaults:
      run:
        working-directory: workers/elevation
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: workers/elevation
      - run: cargo build --release -p elevation-repack
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # список — через env, а не подстановкой в run: так ввод не попадает в текст скрипта
      - run: scripts/elevation-data.sh $ZIPS
        env:
          ZIPS: ${{ github.event.inputs.zips }}
          R2_MODE: --remote
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
