name: elevation data

# Ручная перепаковка HGT 3″ viewfinderpanoramas в бакет R2 `nakarte-elevation`
# (workers/elevation/scripts/elevation-data.sh). Заливка — через S3 API R2 токеном с правом
# Object Read & Write на этот бакет (секреты R2_ACCESS_KEY_ID и R2_SECRET_ACCESS_KEY);
# градусы, которые уже есть в бакете, пропускаются, поэтому оборванный прогон можно перезапустить.

on:
  workflow_dispatch:
    inputs:
      zips:
        description: 'zip на viewfinderpanoramas.org без .zip через пробел (dem3/K38 dem3/L32) или all'
        required: true
        default: 'dem3/K38 dem3/K37 dem3/L32 dem3/G45'

concurrency:
  group: elevation-data
  cancel-in-progress: false

jobs:
  repack:
    if: github.repository == 'sergeycw/nakarte'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    defaults:
      run:
        working-directory: workers/elevation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: workers/elevation
      - run: cargo build --release -p elevation-repack
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      # список — через env, а не подстановкой в run: так ввод не попадает в текст скрипта
      - run: scripts/elevation-data.sh $ZIPS
        env:
          ZIPS: ${{ github.event.inputs.zips }}
          R2_MODE: --remote
          R2_ENDPOINT: https://1f81a3ec34abfc6581cdd0484bbf56a9.r2.cloudflarestorage.com
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
