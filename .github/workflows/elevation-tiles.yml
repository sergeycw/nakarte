name: elevation tiles

# Ручная сборка архива тайлов высот z0–9 из `dem3/` бакета R2 `nakarte-elevation` и заливка его
# в тот же бакет (workers/elevation/scripts/elevation-tiles.sh). Токен — тот же, что у
# `elevation data` (секреты R2_ACCESS_KEY_ID и R2_SECRET_ACCESS_KEY, Object Read & Write на бакет).
# z10–11 Worker считает на лету, поэтому этот прогон нужен только после обновления `dem3/`.
# После перезаливки Worker передеплоить: кеш изолята держит страницы старого индекса.

on:
  workflow_dispatch:
    inputs:
      bbox:
        description: 'W,S,E,N — только блоки z5, задевающие область; пусто — весь мир'
        required: false
        default: ''

concurrency:
  group: elevation-tiles
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'sergeycw/nakarte'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    defaults:
      run:
        working-directory: workers/elevation
    steps:
      # весь `dem3/` — 13.1 ГБ, архив — ещё ≈ 3.5 ГБ, а свободно на раннере ≈ 14 ГБ:
      # предустановленные SDK, которые здесь не нужны, освобождают ещё ≈ 25 ГБ
      - run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
        working-directory: /
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: workers/elevation
      - run: cargo build --release -p elevation-tiles
      # bbox — через env, а не подстановкой в run: так ввод не попадает в текст скрипта
      - run: scripts/elevation-tiles.sh
        env:
          BBOX: ${{ github.event.inputs.bbox }}
          WORK_DIR: ${{ runner.temp }}
          R2_MODE: --remote
          R2_ENDPOINT: https://1f81a3ec34abfc6581cdd0484bbf56a9.r2.cloudflarestorage.com
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
