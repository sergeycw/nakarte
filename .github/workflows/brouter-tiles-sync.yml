name: brouter tiles sync

on:
  schedule:
      - cron: '0 4 * * 1'
  workflow_dispatch:
    inputs:
      only:
        description: 'Comma-separated tile names to sync, e.g. E40_N40 (empty = all)'
        required: false
        default: ''

concurrency:
  group: brouter-tiles-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'sergeycw/nakarte'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      # S3 API R2 (aws CLI есть на раннере) с ключами токена «nakarte-elevation data upload»: запись только в
      # бакеты nakarte-elevation и nakarte-tiles; токен Cloudflare синхронизации не нужен (change sync-tiles-via-s3)
      - run: node scripts/brouter-tiles-sync.mjs
        env:
          R2_MODE: remote
          ONLY: ${{ github.event.inputs.only }}
          R2_ENDPOINT: https://1f81a3ec34abfc6581cdd0484bbf56a9.r2.cloudflarestorage.com
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
