name: check web

# Приложение web/ (openspec/specs/web-client): линт, типы, Vitest (unit и browser mode),
# сборка, проверка бандла на адреса автора, Playwright e2e. В сеть тесты не ходят. Деплой гоняет
# те же тесты перед публикацией Pages (deploy-pages.yml, job pages).

on:
  push:
    branches: [master]
    paths:
      - 'web/**'
      - 'scripts/check-no-author-hosts.mjs'
      - '.github/workflows/check-web.yml'
  pull_request:
    paths:
      - 'web/**'
      - 'scripts/check-no-author-hosts.mjs'
      - '.github/workflows/check-web.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # браузеры Playwright не кешируются: так советует его документация (playwright.dev/docs/ci)
      - run: npx playwright install --with-deps chromium
      - run: npx biome ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node ../scripts/check-no-author-hosts.mjs ../build
      - run: npm run e2e
