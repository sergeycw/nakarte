name = "nakarte-routing"
pages_build_output_dir = "build"
compatibility_date = "2025-09-01"

[[r2_buckets]]
binding = "TILES"
bucket_name = "nakarte-tiles"

# Счётчик частоты для функций /tiles/ и /brouter-wasm/ (их _middleware.js): Worker nakarte-guard из
# workers/guard. Вызов по service binding не тарифицируется как запрос; без привязки функции не лимитируются.
[[services]]
binding = "GUARD"
service = "nakarte-guard"
