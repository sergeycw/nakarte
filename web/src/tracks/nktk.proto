// Схема строки трека nktk версии 4: копия src/lib/leaflet.control.track-list/lib/parsers/nktk.proto старого клиента
// с новым полем Segment.route (design add-web-autosave, «Ссылка: необязательное поле разметки»). Код не генерируется:
// чтение и запись написаны руками в nktk.ts. Номера полей не менять — на них держатся выданные ссылки.

syntax = "proto3";

message Segment {
    repeated sint32 lats = 1;
    repeated sint32 lons = 2;
    // разметка маршрута отрезка; нет поля — обычная ломаная. Старый клиент поле пропускает.
    SegmentRoute route = 3;
}

message SegmentRoute {
    // шаги между номерами опорных точек в отрезке (≥ 1); первая опорная — точка 0, последняя — последняя точка
    repeated uint32 gaps = 1;
    // по коду на отрезок между опорными: 0 — прямой, 2k+1 — проложен активностью activities[k],
    // 2k+2 — непроложенный с активностью activities[k]
    repeated uint32 legs = 2;
    // id активностей (routing/brouter.ts) без повторов
    repeated string activities = 3;
}

message Waypoint {
    sint32 lat = 1;
    sint32 lon = 2;
    string name = 3;
}

message Waypoints {
    sint32 midLat = 1;
    sint32 midLon = 2;
    repeated Waypoint waypoints = 3;
}

message Track {
    string name = 1;
    repeated Segment segments = 2;
    Waypoints waypoints = 3;
}

message View {
    int32 color = 1;
    bool shown = 2;
    bool ticksShown = 3;
}

message TrackView {
    View view = 1;
    Track track = 2;
}
