name = "nakarte-cors-proxy"
main = "src/index.js"
compatibility_date = "2025-09-01"
# Version URL (<версия>-<worker>.nakarte-routing.workers.dev) выключены для всех версий: старая версия
# со старыми лимитами обходила бы лимиты новой (requirement «Только основной адрес Worker'а», worker-limits).
preview_urls = false

# Workers Logs: история запросов и console.log в дашборде Cloudflare, хранятся 7 дней. В Workers Paid
# включено 20 млн событий в месяц, дальше $0.60 за миллион (цены меняются с 2026-12-01); при росте
# трафика понизить head_sampling_rate (доля записываемых запросов, по умолчанию 1).
[observability]
enabled = true

# Потолок на один вызов: наблюдённый максимум CPU — 2 мс, на запрос один fetch (redirect: manual).
# Тайл heatmap при обновлении кук Strava добавляет до 4 запросов страницы (src/strava.js).
[limits]
cpu_ms = 500
subrequests = 50

[vars]
# 9876 — karma: апстримные тесты test_track_load.js ходят в живые сервисы через этот прокси.
ALLOWED_ORIGINS = "https://nakarte-routing.pages.dev,http://localhost:8765,http://localhost:8766,http://localhost:9876"

# Частота с одного IP (CF-Connecting-IP) за 60 с. Через прокси идут тайловые слои (Strava,
# Tsvetkov, swisstopo, wikimapia) и печать, поэтому лимит выше, чем у остальных Worker'ов.
# namespace_id — номер счётчика, уникальный в аккаунте: 1001–1004 заняты Worker'ами клона.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1004"
simple = { limit = 1200, period = 60 }
