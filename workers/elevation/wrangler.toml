name = "nakarte-elevation"
main = "worker/build/index.js"
compatibility_date = "2025-09-01"
# Version URL (<версия>-<worker>.nakarte-routing.workers.dev) выключены для всех версий: старая версия
# со старыми лимитами обходила бы лимиты новой (requirement «Только основной адрес Worker'а», worker-limits).
preview_urls = false

# Workers Logs: история запросов и console.log в дашборде Cloudflare, хранятся 7 дней. В Workers Paid
# включено 20 млн событий в месяц, дальше $0.60 за миллион (цены меняются с 2026-12-01); при росте
# трафика понизить head_sampling_rate (доля записываемых запросов, по умолчанию 1).
[observability]
enabled = true

# Потолок на один вызов. CPU — с запасом от наблюдённого максимума 3.8 с (API на тысячах точек
# вразброс). Чтения R2 через привязку — тоже подзапросы: запрос API читает не больше 512 раз
# (MAX_READS в core/src/request.rs); 1100 — запас вместо платформенных 10 000.
[limits]
cpu_ms = 10000
subrequests = 1100

[build]
command = "worker-build --release worker"

[vars]
ALLOWED_ORIGINS = "https://nakarte-routing.pages.dev,http://localhost:8765,http://localhost:8766"

[[r2_buckets]]
binding = "DEM"
bucket_name = "nakarte-elevation"

# Частота запросов API с одного IP (CF-Connecting-IP) за 60 с; namespace_id уникален в аккаунте
# (1002–1008 — Worker'ы клона; 1001 был у тайлов высот, освобождён change retire-old-client-services).
[[ratelimits]]
name = "API_RATE_LIMITER"
namespace_id = "1002"
simple = { limit = 60, period = 60 }

# Бюджет чтений R2 API высот с одного IP за 60 с: запрос тратит вызов на каждые 64 запланированных
# чтения (READS_PER_UNIT в core/src/http.rs), 32 вызова — 2 048 чтений, ≈ 4 профиля трека на 5 000 км.
[[ratelimits]]
name = "API_READS_RATE_LIMITER"
namespace_id = "1005"
simple = { limit = 32, period = 60 }
