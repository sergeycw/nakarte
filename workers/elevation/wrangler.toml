name = "nakarte-elevation"
main = "worker/build/index.js"
compatibility_date = "2025-09-01"
# Version URL (<версия>-<worker>.nakarte-routing.workers.dev) выключены для всех версий: старая версия
# со старыми лимитами обходила бы лимиты новой (requirement «Только основной адрес Worker'а», worker-limits).
preview_urls = false

# Workers Logs: история запросов и console.log в дашборде Cloudflare, хранятся 7 дней. В Workers Paid
# включено 20 млн событий в месяц, дальше $0.60 за миллион (цены меняются с 2026-12-01); при росте
# трафика понизить head_sampling_rate (доля записываемых запросов, по умолчанию 1).
[observability]
enabled = true

# Потолок на один вызов. CPU — с запасом от наблюдённого максимума 3.8 с (API на тысячах точек
# вразброс); subrequests не задан: 10 000 точек вразброс законно дают тысячи чтений R2.
[limits]
cpu_ms = 10000

[build]
command = "worker-build --release worker"

[vars]
ALLOWED_ORIGINS = "https://nakarte-routing.pages.dev,http://localhost:8765,http://localhost:8766"

[[r2_buckets]]
binding = "DEM"
bucket_name = "nakarte-elevation"

# Частота с одного IP (CF-Connecting-IP) за 60 с, у тайлов и API свои счётчики;
# namespace_id уникален в аккаунте (1001–1004 — Worker'ы клона).
[[ratelimits]]
name = "TILES_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 600, period = 60 }

[[ratelimits]]
name = "API_RATE_LIMITER"
namespace_id = "1002"
simple = { limit = 60, period = 60 }
