[workspace]
resolver = "3"
members = ["core", "worker", "server", "repack"]

[workspace.package]
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
elevation-core = { path = "core" }

[profile.release]
lto = true
codegen-units = 1

[profile.release.package.elevation-worker]
opt-level = "s"

# Тесты тайлов считают растры z11 в сотни тысяч пикселей: без оптимизаций — заметно дольше.
[profile.test.package.elevation-core]
opt-level = 3
