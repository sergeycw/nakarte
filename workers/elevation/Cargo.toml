[workspace]
resolver = "3"
members = ["core", "worker", "server", "repack", "tiles"]

[workspace.package]
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
elevation-core = { path = "core" }

[profile.release]
lto = true
codegen-units = 1

[profile.release.package.elevation-worker]
opt-level = "s"

# Тест генератора считает растр блока z5 (16 447² пикселей): без оптимизаций — десятки секунд.
[profile.test.package.elevation-core]
opt-level = 3

[profile.test.package.elevation-tiles]
opt-level = 3
