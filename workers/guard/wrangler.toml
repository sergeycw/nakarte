name = "nakarte-guard"
main = "src/index.js"
compatibility_date = "2025-09-01"
# Счётчик частоты для Pages Functions клона (привязку rate limiting Pages не поддерживают). Снаружи закрыт:
# его зовут только функции по service binding GUARD (корневой wrangler.toml), поэтому заголовку X-Client-IP
# можно верить. Решения — change limit-pages-functions.
workers_dev = false
preview_urls = false

# Потолок на один вызов: один вызов привязки, без подзапросов наружу.
[limits]
cpu_ms = 50
subrequests = 5

# Запросы к /tiles/ и /brouter-wasm/ с одного IP за 60 с: маршрут — ≈ 40 Range-чтений тайлов, запуск
# движка — чтения jar и профилей. namespace_id уникален в аккаунте (1001–1008 — Worker'ы клона).
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1008"
simple = { limit = 1200, period = 60 }
